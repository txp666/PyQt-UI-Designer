name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  compatibility:
    name: Compatibility (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q app main.py deploy.py tests
      - name: Platform regression tests
        run: python -m unittest discover -s tests -v
      - name: Native GUI and exported application smoke test
        run: python tests/smoke_gui.py
      - name: Store crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports-${{ matrix.os }}-${{ matrix.python }}
          path: ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
