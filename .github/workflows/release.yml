name: Release Build

# Push a tag vX.Y.Z matching APP_VERSION. A tag with a suffix (v0.2.0-rc.1) builds the same
# way but is published as a pre-release, which the in-app update check does not offer.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Nuitka Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from app.common.metadata import APP_VERSION; assert os.environ['RELEASE_TAG'].split('-')[0] == 'v' + APP_VERSION"
      - name: Regression and native GUI checks
        run: |
          python -m unittest discover -s tests -v
          python tests/smoke_gui.py
      - name: Build and archive
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          base="${RELEASE_TAG%%-*}"
          python deploy.py --version "${base#v}" --archive-name "PyQt-UI-Designer-${RELEASE_TAG}-${BUILD_PLATFORM}"
      - name: Verify packaged application
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          base="${RELEASE_TAG%%-*}"
          python tests/smoke_dist.py "build/PyQt-UI-Designer-${RELEASE_TAG}-${BUILD_PLATFORM}.zip" --version "${base#v}"
      - name: Store verified packages
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            build/*.zip
            build/*.zip.sha256
          if-no-files-found: error
      - name: Store diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            nuitka-crash-report.xml
            build/*smoke*.png
            build/*.log
            ~/Library/Logs/DiagnosticReports/*.ips

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Check complete package set
        run: |
          test "$(find release-assets -name '*.zip' | wc -l)" -eq 3
          test "$(find release-assets -name '*.sha256' | wc -l)" -eq 3
          cd release-assets
          sha256sum -c *.sha256
      - name: Release kind
        id: kind
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "notes=docs/release-notes/${RELEASE_TAG%%-*}.md" >> "$GITHUB_OUTPUT"
          case "$RELEASE_TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.kind.outputs.notes }}
          files: release-assets/*
          fail_on_unmatched_files: true
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.kind.outputs.prerelease == 'false' }}
